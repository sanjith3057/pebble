<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Strict Content Security Policy: only bundled scripts, styles and images -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';">
    <title>Pebble</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #fx {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* ---------- Speech bubble ---------- */
        .bubble {
            position: absolute;
            left: 50%;
            bottom: 252px;
            z-index: 3;
            max-width: 250px;
            min-width: 120px;
            padding: 10px 14px;
            background: #fff;
            color: #222;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
            text-align: center;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
            transform: translateX(-50%) translateY(6px) scale(0.85);
            transform-origin: bottom center;
            opacity: 0;
            transition: opacity 0.18s ease, transform 0.28s cubic-bezier(.34, 1.56, .64, 1);
            pointer-events: none;
        }

        .bubble::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -8px;
            margin-left: -8px;
            border: 8px solid transparent;
            border-bottom: 0;
            border-top-color: #fff;
        }

        .bubble.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .bubble.interactive {
            pointer-events: auto;
        }

        .bubble-actions {
            display: none;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
        }

        .bubble.interactive .bubble-actions {
            display: flex;
        }

        .bubble-actions button {
            font: inherit;
            font-size: 12px;
            padding: 5px 10px;
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            background: #eef1f6;
            color: #333;
        }

        .bubble-actions button.primary {
            background: #4f7cff;
            color: #fff;
        }

        .bubble-actions button:focus-visible {
            outline: 2px solid #4f7cff;
            outline-offset: 2px;
        }

        /* ---------- Character ----------
           stage > lean (cursor) > motion (state) > squash (pose change) > breath > layers */
        .stage {
            position: absolute;
            left: 50%;
            bottom: 8px;
            width: 240px;
            height: 236px;
            margin-left: -120px;
            z-index: 1;
        }

        .lean, .motion, .squash, .breath {
            position: absolute;
            inset: 0;
            transform-origin: bottom center;
        }

        .lean {
            transition: transform 0.6s cubic-bezier(.2, .8, .2, 1);
        }

        .shadow {
            position: absolute;
            left: 50%;
            bottom: -4px;
            width: 150px;
            height: 18px;
            margin-left: -75px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            transform-origin: center;
        }

        .layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: bottom center;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
            cursor: grab;
            -webkit-user-drag: none;
            opacity: 0;
            transition: opacity 0.18s ease;
        }

        .layer.front {
            opacity: 1;
        }

        .stage:active .layer {
            cursor: grabbing;
        }

        /* ---------- Per-state motion (System Design §46.3) ---------- */
        [data-state="idle"] .motion,
        [data-state="fidget"] .motion { animation: sway 6s ease-in-out infinite; }
        [data-state="idle"] .breath,
        [data-state="fidget"] .breath,
        [data-state="reminder"] .breath { animation: breathe 3.4s ease-in-out infinite; }
        [data-state="sleep"] .breath { animation: breathe-deep 5s ease-in-out infinite; }
        [data-state="greet"] .motion { animation: hop 0.55s ease-out 2; }
        [data-state="greet"] .shadow { animation: shadow-hop 0.55s ease-out 2; }
        [data-state="enter"] .motion { animation: run-in 1.1s cubic-bezier(.2, .9, .3, 1) both; }
        [data-state="enter"] .breath { animation: hop-small 0.28s ease-in-out infinite; }
        [data-state="enter"] .shadow { animation: shadow-run-in 1.1s cubic-bezier(.2, .9, .3, 1) both; }
        [data-state="curious"] .motion { animation: lean-in 1.6s ease-in-out infinite; }
        [data-state="thinking"] .motion { animation: wobble 2s ease-in-out infinite; }
        [data-state="talking"] .breath { animation: chatter 0.42s ease-in-out infinite; }
        [data-state="success"] .motion { animation: jump 0.65s cubic-bezier(.3, .7, .4, 1) 3; }
        [data-state="success"] .shadow { animation: shadow-jump 0.65s cubic-bezier(.3, .7, .4, 1) 3; }
        [data-state="warning"] .motion,
        [data-state="reminder"] .motion { animation: attention 1.1s ease-in-out infinite; }
        [data-state="error"] .motion { animation: shake 0.45s ease-in-out 2; }
        [data-state="music"] .motion { animation: groove 0.9s ease-in-out infinite; }
        [data-state="music"] .breath { animation: breathe 3.4s ease-in-out infinite; }
        [data-state="search"] .motion { animation: lean-in 2.2s ease-in-out infinite; }

        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            30%      { transform: rotate(-1.2deg); }
            70%      { transform: rotate(1.2deg); }
        }
        @keyframes groove {
            0%, 100% { transform: rotate(-2deg) translateY(0); }
            25%      { transform: rotate(0deg) translateY(-3px); }
            50%      { transform: rotate(2deg) translateY(0); }
            75%      { transform: rotate(0deg) translateY(-3px); }
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1, 1); }
            50%      { transform: scale(1.012, 1.028); }
        }
        @keyframes breathe-deep {
            0%, 100% { transform: scale(1, 1); }
            45%      { transform: scale(1.03, 1.05); }
        }
        @keyframes hop {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            15%      { transform: translateY(0) scale(1.05, 0.95); }
            45%      { transform: translateY(-16px) scale(0.98, 1.03); }
        }
        @keyframes hop-small {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }
        @keyframes run-in {
            from { transform: translateX(-230px); }
            80%  { transform: translateX(8px); }
            to   { transform: translateX(0); }
        }
        @keyframes lean-in {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            50%      { transform: rotate(-4deg) translateX(-4px); }
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25%      { transform: rotate(-3deg); }
            75%      { transform: rotate(3deg); }
        }
        @keyframes chatter {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            50%      { transform: translateY(-3px) scale(1.01, 0.985); }
        }
        @keyframes jump {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            12%      { transform: translateY(0) scale(1.08, 0.9); }
            45%      { transform: translateY(-34px) scale(0.96, 1.05); }
            80%      { transform: translateY(0) scale(1.04, 0.96); }
        }
        @keyframes attention {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25%      { transform: scale(1.04) rotate(-1.5deg); }
            50%      { transform: scale(1.05) rotate(1.5deg); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-7px); }
            40%, 80% { transform: translateX(7px); }
        }
        @keyframes shadow-hop {
            0%, 100% { transform: scale(1); opacity: 1; }
            45%      { transform: scale(0.75); opacity: 0.6; }
        }
        @keyframes shadow-jump {
            0%, 100% { transform: scale(1); opacity: 1; }
            45%      { transform: scale(0.6); opacity: 0.45; }
        }
        @keyframes shadow-run-in {
            from { transform: translateX(-230px); }
            80%  { transform: translateX(8px); }
            to   { transform: translateX(0); }
        }

        /* Reduced: keep gentle breathing only. Off: completely still. */
        body[data-anim="reduced"] .motion,
        body[data-anim="reduced"] .shadow,
        body[data-anim="off"] .motion,
        body[data-anim="off"] .breath,
        body[data-anim="off"] .shadow { animation: none !important; }
        body[data-anim="reduced"] .lean,
        body[data-anim="off"] .lean { transform: none !important; }

        @media (prefers-reduced-motion: reduce) {
            .motion, .shadow, .breath { animation: none !important; }
            .lean { transform: none !important; }
        }
    </style>
</head>
<body data-anim="full">
    <canvas id="fx"></canvas>

    <div class="bubble" id="bubble" role="status" aria-live="polite">
        <div id="bubble-text"></div>
        <div class="bubble-actions" data-hit>
            <button class="primary" id="btn-done">Done ✓</button>
            <button id="btn-snooze">Snooze 10 min</button>
        </div>
    </div>

    <div class="stage" id="stage" data-hit>
        <div class="lean" id="lean">
            <div class="shadow"></div>
            <div class="motion">
                <div class="squash" id="squash">
                    <div class="breath">
                        <img class="layer front" id="layer-a" alt="Pebble character" draggable="false">
                        <img class="layer" id="layer-b" alt="" draggable="false">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- External scripts to comply with CSP -->
    <script src="character-state.js"></script>
    <script src="particles.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
